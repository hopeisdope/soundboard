<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#141821">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Soundboard">
<title>Soundboard</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="app-header">
  <h1>Soundboard</h1>
  <div class="header-actions">
    <button id="reorder-toggle" class="icon-button" type="button" aria-pressed="false">Reorder</button>
    <button id="add-button" class="icon-button icon-button-primary" type="button" aria-label="Add sound">+</button>
  </div>
</header>

<div id="update-banner" class="update-banner" hidden>
  <span>An update is ready.</span>
  <button id="update-reload" type="button">Reload</button>
</div>

<main id="grid" class="grid" aria-live="polite"></main>

<p id="empty-state" class="empty-state" hidden>
  No sounds yet. Tap <strong>+</strong> to add your first one.
</p>

<dialog id="button-modal" class="button-modal">
  <form id="button-form" method="dialog" novalidate>
    <h2 id="modal-title">Add sound</h2>

    <label class="field">
      <span class="field-label">Sound file (.mp3, .wav, .m4a)</span>
      <input type="file" id="field-file" accept=".mp3,.wav,.m4a,audio/mpeg,audio/wav,audio/x-wav,audio/mp4,audio/x-m4a">
      <span id="file-name" class="file-name"></span>
      <span class="field-error" id="error-file"></span>
    </label>

    <label class="field">
      <span class="field-label">Name</span>
      <input type="text" id="field-name" maxlength="40" placeholder="Air horn" required autocomplete="off">
      <span class="field-error" id="error-name"></span>
    </label>

    <label class="field">
      <span class="field-label">Icon (emoji)</span>
      <input type="text" id="field-emoji" maxlength="8" placeholder="😀" autocomplete="off">
      <span class="field-error" id="error-emoji"></span>
    </label>

    <div class="preview">
      <span class="preview-label">Preview</span>
      <div class="preview-tile">
        <span id="preview-emoji" class="preview-emoji">🔊</span>
        <span id="preview-name" class="preview-name">Sound name</span>
      </div>
    </div>

    <div class="modal-actions">
      <button type="button" id="delete-button" class="text-button danger" hidden>Delete</button>
      <div class="modal-actions-right">
        <button type="button" id="cancel-button" class="text-button">Cancel</button>
        <button type="submit" id="save-button" class="text-button primary">Save</button>
      </div>
    </div>
  </form>
</dialog>

<script type="module" src="js/app.js"></script>
</body>
</html>
